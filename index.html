<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransPrix Douala</title>
    <link rel="manifest" href="/transprix-douala/manifest.json">
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f7f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 450px; background: white; margin: 10px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #e67e22; font-size: 26px; margin: 0 0 5px 0; text-align: center; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin: 0 0 20px 0; text-align: center; }
        .search-container { position: relative; margin-top: 5px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: #2c3e50; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd1d1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #3498db; outline: none; }
        .suggestions-list { position: absolute; width: 100%; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto; z-index: 10; display: none; }
        .suggestions-list div { padding: 10px; cursor: pointer; }
        .suggestions-list div:hover { background: #f1f1f1; }
        button { background: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .resultat { margin-top: 25px; padding: 15px; background: #ebf5fb; border: 1px solid #a9dfbf; border-radius: 8px; display: none; }
        .prix { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 8px 0; }
        .btn-partager { background: #0076ff; color: white; margin-top: 15px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; }
        .btn-installer { background: #e67e22; color: white; margin-top: 10px; display: none; font-weight: bold; }
        .suggestion-box { margin-top: 35px; border-top: 2px dashed #bdc3c7; padding-top: 20px; }
        .statut-badge { color: #e67e22; font-weight: bold; margin: 10px 0; display: block; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🇨🇲 TransPrix Douala</h1>
    <p class="subtitle">Trouvez le juste prix pour votre trajet</p>
    <div id="statutChargement" class="statut-badge">🔄 Connexion à Google Sheets...</div>
    <button id="btnPWAInstall" class="btn-installer">📲 Installer l'application sur mon écran</button>
    <label>📍 Lieu de Départ :</label>
    <div class="search-container"><input type="text" id="searchDepart" placeholder="Tapez le quartier..." oninput="filtrerQuartiers('Depart')"><div id="optionsDepart" class="suggestions-list"></div></div>
    <label>🏁 Lieu d'Arrivée :</label>
    <div class="search-container"><input type="text" id="searchArrivee" placeholder="Tapez le quartier..." oninput="filtrerQuartiers('Arrivee')"><div id="optionsArrivee" class="suggestions-list"></div></div>
    <button id="btnCalculer" onclick="calculerPrix()">Afficher les Tarifs</button>
    <div id="resultatBox" class="resultat">
        <h3 style="margin:0; color:#2980b9;">Tarifs indicatifs :</h3>
        <p class="prix" id="prixMoto">🏍️ Moto : -- FCFA</p>
        <p class="prix" id="prixTaxi">🚖 Taxi : -- FCFA</p>
        <small style="color:#7f8c8d;">* Les prix varient selon l'heure ou la météo.</small>
        <button id="btnPartager" class="btn-partager" onclick="partagerTarif()">🔗 Partager ce tarif (WhatsApp, etc.)</button>
    </div>
    <div class="suggestion-box">
        <h3>📢 Un trajet manquant ?</h3>
        <form action="https://formspree.io" method="POST">
            <input type="text" name="trajet" placeholder="Ex: De Ndokoti vers Yassa" required>
            <input type="text" name="prix_propose" placeholder="Ex: Moto 600 F" required>
            <textarea name="commentaire" placeholder="Remarques..." rows="2"></textarea>
            <button type="submit" style="background:#34495e;">Envoyer</button>
        </form>
    </div>
</div>
<script>
let listeQuartiers = []; let tarifsEnDirect = {}; let textePartageGlobal = "";
const urlCSV = "https://google.com";

async function chargerDonneesSheets() {
    try {
        const response = await fetch(urlCSV + "&cb=" + new Date().getTime());
        const csvText = await response.text();
        Papa.parse(csvText, {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                let setQ = new Set();
                results.data.forEach(l => {
                    const d = (l.Depart || l.depart || "").trim(); const a = (l.Arrivee || l.arrivee || "").trim();
                    const m = (l.Moto || l.moto || "").trim(); const t = (l.Taxi || l.taxi || "").trim();
                    if (d && a) {
                        setQ.add(d); setQ.add(a);
                        tarifsEnDirect[d.toLowerCase() + "_" + a.toLowerCase()] = { moto: m, taxi: t };
                        tarifsEnDirect[a.toLowerCase() + "_" + d.toLowerCase()] = { moto: m, taxi: t };
                    }
                });
                listeQuartiers = Array.from(setQ).sort();
                document.getElementById("statutChargement").innerText = "🟢 Connecté en direct à Google Sheets";
                document.getElementById("statutChargement").style.color = "#2ecc71";
                setTimeout(() => { document.getElementById("statutChargement").style.display = "none"; }, 2000);
            }
        });
    } catch (e) {
        document.getElementById("statutChargement").innerText = "⚠️ Mode local de secours actif";
        listeQuartiers = ["Akwa", "Bali", "Bonabéri", "Bonamoussadi", "Bonanjo", "Ndokoti", "Yassa"];
    }
}
function filtrerQuartiers(type) {
    const input = document.getElementById("search" + type); const box = document.getElementById("options" + type); const texte = input.value.toLowerCase().trim(); box.innerHTML = ""; if (!texte) { box.style.display = "none"; return; }
    const correspondances = listeQuartiers.filter(q => q.toLowerCase().includes(texte));
    if (correspondances.length > 0) {
        box.style.display = "block";
        correspondances.forEach(q => {
            const div = document.createElement("div"); div.innerText = q; div.onclick = function() { input.value = q; box.style.display = "none"; }; box.appendChild(div);
        });
    } else { box.style.display = "none"; }
}
document.addEventListener("click", function(e) {
    if (e.target && e.target.id && !e.target.id.startsWith("search")) { document.getElementById("optionsDepart").style.display = "none"; document.getElementById("optionsArrivee").style.display = "none"; }
});
function calculerPrix() {
    const d = document.getElementById("searchDepart").value.trim(); const a = document.getElementById("searchArrivee").value.trim();
    if (!d || !a || d.toLowerCase() === a.toLowerCase()) { alert("Sélectionnez deux quartiers différents."); return; }
    const trajet = tarifsEnDirect[(d + "_" + a).toLowerCase()];
    if (trajet) {
        document.getElementById("prixMoto").innerText = "🏍️ Moto : " + trajet.moto + " FCFA"; document.getElementById("prixTaxi").innerText = "🚖 Taxi : " + trajet.taxi + " FCFA"; document.getElementById("resultatBox").style.display = "block";
        textePartageGlobal = "Tarif TransPrix Douala (" + d + " ➡️ " + a + ") :\n🏍️ Moto : " + trajet.moto + " F\n🚖 Taxi : " + trajet.taxi + " F.\n\nSimule ici : https://github.io";
    } else { alert("Ce trajet n'est pas encore dans votre Sheets mobile. Ajoutez-le !"); }
}
function partagerTarif() { if (navigator.share) { navigator.share({ title: 'TransPrix', text: textePartageGlobal }); } else { alert("Partage non supporté."); } }
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('btnPWAInstall').style.display = 'block'; });
document.getElementById('btnPWAInstall').addEventListener('click', async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') document.getElementById('btnPWAInstall').style.display = 'none'; deferredPrompt = null; }
});
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/transprix-douala/sw.js'); }); }
chargerDonneesSheets();
</script>
</body>
</html>
