<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransPrix Douala</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f7f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 450px; background: white; margin: 10px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #e67e22; font-size: 26px; margin-bottom: 5px; text-align: center; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-top: 0; margin-bottom: 20px; text-align: center; }
        .search-container { position: relative; margin-top: 5px; }
        label { font-weight: bold; display: block; margin-top: 15px; text-align: left; font-size: 14px; color: #2c3e50; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd1d1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #3498db; outline: none; }
        .suggestions-list { position: absolute; width: 100%; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .suggestions-list div { padding: 10px; cursor: pointer; text-align: left; }
        .suggestions-list div:hover { background-color: #f1f1f1; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .resultat { margin-top: 25px; padding: 15px; background: #ebf5fb; border: 1px solid #a9dfbf; border-radius: 8px; display: none; }
        .prix { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 8px 0; text-align: left; }
        .suggestion-box { margin-top: 35px; border-top: 2px dashed #bdc3c7; padding-top: 20px; text-align: left; }
        .suggestion-box h3 { color: #2c3e50; font-size: 18px; margin-top: 0; }
        .btn-suggestion { background-color: #34495e; }
        .statut-badge { color: #2ecc71; font-weight: bold; margin: 10px 0; display: block; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🇨🇲 TransPrix Douala</h1>
    <p class="subtitle">Trouvez le juste prix pour votre trajet</p>
    <div id="statutChargement" class="statut-badge">静态 - En attente de calcul</div>
    <label>📍 Lieu de Départ :</label>
    <div class="search-container">
        <input type="text" id="searchDepart" placeholder="Tapez le quartier..." oninput="filtrerQuartiers('Depart')">
        <div id="optionsDepart" class="suggestions-list"></div>
    </div>
    <label>🏁 Lieu d'Arrivée :</label>
    <div class="search-container">
        <input type="text" id="searchArrivee" placeholder="Tapez le quartier..." oninput="filtrerQuartiers('Arrivee')">
        <div id="optionsArrivee" class="suggestions-list"></div>
    </div>
    <button id="btnCalculer" onclick="calculerPrix()">Afficher les Tarifs</button>
    <div id="resultatBox" class="resultat">
        <h3 style="margin-top:0; color:#2980b9;">Tarifs indicatifs :</h3>
        <p class="prix" id="prixMoto">🏍️ Moto : -- FCFA</p>
        <p class="prix" id="prixTaxi">🚖 Taxi : -- FCFA</p>
    </div>
    <div class="suggestion-box">
        <h3>📢 Un trajet manquant ?</h3>
        <form action="https://formspree.io" method="POST">
            <input type="text" name="trajet" placeholder="Ex: De Ndokoti vers Yassa" required>
            <input type="text" name="prix_propose" placeholder="Ex: Moto 600 F" required>
            <textarea name="commentaire" placeholder="Remarques..." rows="2"></textarea>
            <button type="submit" class="btn-suggestion">Envoyer</button>
        </form>
    </div>
</div>
<script>
let listeQuartiers = ["Akwa", "Bali", "Bonabéri", "Bonamoussadi", "Bonanjo", "Bonapriso", "Campus Ange Raphaël", "Campus Ndogbong", "Cité des Palmiers", "New Bell", "Ndogbong", "Ndogpassi", "Ndokoti", "PK 21", "Yassa"];
let tarifsLocauxSecours = { "yassa_akwa": { moto: 600, taxi: 500 }, "ndokoti_campus ndogbong": { moto: 200, taxi: 200 }, "bonabéri_akwa": { moto: 400, taxi: 350 }, "yassa_ndokoti": { moto: 400, taxi: 350 } };
let tarifsEnDirect = {};
const sheetId = "1KYk0UMfK49WkpoEz3mux6A25LGa2E4uZDXFJ6fi2n3Y";
const urlGviz = "https://google.com" + sheetId + "/gviz/tq?tqx=out:json";

function filtrerQuartiers(type) {
    const input = document.getElementById("search" + type);
    const box = document.getElementById("options" + type);
    const texte = input.value.toLowerCase().trim();
    box.innerHTML = "";
    if (!texte) { box.style.display = "none"; return; }
    const correspondances = listeQuartiers.filter(q => q.toLowerCase().includes(texte));
    if (correspondances.length > 0) {
        box.style.display = "block";
        correspondances.forEach(q => {
            const div = document.createElement("div");
            div.innerText = q;
            div.onclick = function() { input.value = q; box.style.display = "none"; };
            box.appendChild(div);
        });
    } else { box.style.display = "none"; }
}
document.addEventListener("click", function(e) {
    if (e.target && e.target.id && !e.target.id.startsWith("search")) {
        document.getElementById("optionsDepart").style.display = "none";
        document.getElementById("optionsArrivee").style.display = "none";
    }
});
async function calculerPrix() {
    const d = document.getElementById("searchDepart").value.trim();
    const a = document.getElementById("searchArrivee").value.trim();
    if (!d || !a || d.toLowerCase() === a.toLowerCase()) { alert("Sélectionnez deux quartiers différents."); return; }
    document.getElementById("statutChargement").innerText = "⏳ Recherche...";
    const clef = (d + "_" + a).toLowerCase();
    const clefR = (a + "_" + d).toLowerCase();
    try {
        const response = await fetch(urlGviz + "&cb=" + new Date().getTime());
        const text = await response.text();
        const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
        json.table.rows.forEach(row => {
            const cell = row.c;
            if (cell && cell.length >= 4 && cell[0] && cell[1]) {
                const dep = cell[0].v.toString().trim().toLowerCase();
                const arr = cell[1].v.toString().trim().toLowerCase();
                const mo = cell[2] && cell[2].v ? cell[2].v : "--";
                const ta = cell[3] && cell[3].v ? cell[3].v : "--";
                tarifsEnDirect[dep + "_" + arr] = { moto: mo, taxi: ta };
            }
        });
        document.getElementById("statutChargement").innerText = "🟢 Connecté à Google Sheets";
        const t = tarifsEnDirect[clef] || tarifsEnDirect[clefR];
        if (t) { afficher(t.moto, t.taxi); } else { alert("Trajet non répertorié sur Sheets."); }
    } catch (e) {
        document.getElementById("statutChargement").innerText = "🟢 Base ultra-rapide active";
        const ts = tarifsLocauxSecours[clef] || tarifsLocauxSecours[clefR];
        if (ts) { afficher(ts.moto, ts.taxi); } else { alert("Trajet non répertorié localement."); }
    }
}
function afficher(m, t) {
    document.getElementById("prixMoto").innerText = "🏍️ Moto : " + m + " FCFA";
    document.getElementById("prixTaxi").innerText = "🚖 Taxi : " + t + " FCFA";
    document.getElementById("resultatBox").style.display = "block";
}
</script>
</body>
</html>
