<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransPrix Douala - Tarifs Moto et Taxi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 450px; background: white; margin: 10px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #e67e22; font-size: 26px; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; text-align: left; font-size: 14px; color: #2c3e50; }
        select, button, input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd1d1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        select:focus { border-color: #3498db; outline: none; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        button:hover { background-color: #27ae60; }
        .resultat { margin-top: 25px; padding: 15px; background: #ebf5fb; border: 1px solid #a9dfbf; border-radius: 8px; display: none; }
        .prix { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 8px 0; text-align: left; }
        .suggestion-box { margin-top: 35px; border-top: 2px dashed #bdc3c7; padding-top: 20px; text-style: left; }
        .suggestion-box h3 { color: #2c3e50; font-size: 18px; margin-top: 0; }
        .btn-suggestion { background-color: #34495e; }
    </style>
</head>
<body>

<div class="container">
    <h1>🇨🇲 TransPrix Douala</h1>
    <p class="subtitle">Trouvez le juste prix pour votre trajet</p>
    
    <!-- SÉLECTION DU DÉPART -->
    <label for="depart">📍 Lieu de Départ :</label>
    <select id="depart">
        <option value="akwa">Akwa</option>
        <option value="bonamoussadi">Bonamoussadi</option>
        <option value="bonanjo">Bonanjo</option>
        <option value="bonapriso">Bonapriso</option>
        <option value="campus_ange_raphael">Campus Ange Raphaël</option>
        <option value="campus_ndogbong">Campus Ndogbong</option>
        <option value="campus_pk17">Campus PK 17 (Polytechnique)</option>
        <option value="cite_des_palmiers">Cité des Palmiers</option>
        <option value="newbell">New Bell</option>
        <option value="ndogbong">Ndogbong</option>
        <option value="ndogpassi">Ndogpassi</option>
        <option value="ndokoti">Ndokoti</option>
        <option value="pk21">PK 21</option>
        <option value="yassa">Yassa (Total Nkolbong)</option>
    </select>

    <!-- SÉLECTION DE L'ARRIVÉE -->
    <label for="arrivee">🏁 Lieu d'Arrivée :</label>
    <select id="arrivee">
        <option value="akwa">Akwa</option>
        <option value="bonamoussadi">Bonamoussadi</option>
        <option value="bonanjo">Bonanjo</option>
        <option value="bonapriso">Bonapriso</option>
        <option value="campus_ange_raphael">Campus Ange Raphaël</option>
        <option value="campus_ndogbong">Campus Ndogbong</option>
        <option value="campus_pk17">Campus PK 17 (Polytechnique)</option>
        <option value="cite_des_palmiers">Cité des Palmiers</option>
        <option value="newbell">New Bell</option>
        <option value="ndogbong">Ndogbong</option>
        <option value="ndogpassi">Ndogpassi</option>
        <option value="ndokoti">Ndokoti</option>
        <option value="pk21">PK 21</option>
        <option value="yassa">Yassa (Total Nkolbong)</option>
    </select>

    <button onclick="calculerPrix()">Afficher les Tarifs</button>

    <!-- ZONE D'AFFICHAGE DES PRIX -->
    <div id="resultatBox" class="resultat">
        <h3 style="margin-top:0; color:#2980b9;">Tarifs indicatifs :</h3>
        <p class="prix" id="prixMoto">🏍️ Moto : -- FCFA</p>
        <p class="prix" id="prixTaxi">🚖 Taxi de course : -- FCFA</p>
        <small style="color: #7f8c8d; display:block; text-align:left; margin-top:10px;">
            * Les prix varient selon l'heure, la météo ou l'état de la route.
        </small>
    </div>

    <!-- FORMULAIRE DE SUGGESTION POUR LES UTILISATEURS -->
    <div class="suggestion-box">
        <h3>📢 Une erreur ou un trajet manquant ?</h3>
        <p class="subtitle">Aidez-nous à mettre à jour les prix de Douala !</p>
        
        <!-- Ce formulaire envoie gratuitement les données sur votre boîte mail via Formspree -->
        <form action="https://formspree.io" method="POST">
            <input type="text" name="trajet" placeholder="Ex: De Ndokoti vers Yassa" required>
            <input type="text" name="prix_propose" placeholder="Ex: Moto 600 F, Taxi 300 F" required>
            <textarea name="commentaire" placeholder="Remarques (Ex: Le soir ça augmente)" rows="2"></textarea>
            <button type="submit" class="btn-suggestion">Envoyer ma suggestion</button>
        </form>
    </div>
</div>

<script>
// BASE DE DONNÉES DES TARIFS (Modifiable facilement)
// Syntaxe : "depart_arrivee": { moto: PRIX, taxi: PRIX }
const tarifs = {
    "yassa_akwa": { moto: 1000, taxi: 500 },
    "yassa_ndokoti": { moto: 600, taxi: 300 },
    "ndokoti_campus_ndogbong": { moto: 250, taxi: 150 },
    "ndokoti_campus_pk17": { moto: 500, taxi: 300 },
    "bonamoussadi_akwa": { moto: 600, taxi: 350 },
    "bonanjo_bonapriso": { moto: 300, taxi: 250 },
    "newbell_akwa": { moto: 400, taxi: 250 },
    "cite_des_palmiers_ndokoti": { moto: 300, taxi: 200 },
    "pk21_ndokoti": { moto: 600, taxi: 350 }
};

function calculerPrix() {
    const depart = document.getElementById("depart").value;
    const arrivee = document.getElementById("arrivee").value;
    
    if (depart === arrivee) {
        alert("Le départ et l'arrivée sont identiques !");
        return;
    }
    
    // Test dans les deux sens (Aller ou Retour)
    const clefAller = depart + "_" + arrivee;
    const clefRetour = arrivee + "_" + depart;
    
    const trajet = tarifs[clefAller] || tarifs[clefRetour];
    
    if (trajet) {
        document.getElementById("prixMoto").innerText = "🏍️ Moto : " + trajet.moto + " FCFA";
        document.getElementById("prixTaxi").innerText = "🚖 Taxi : " + trajet.taxi + " FCFA";
        document.getElementById("resultatBox").style.display = "block";
    } else {
        alert("Ce trajet spécifique n'a pas encore de tarif enregistré. Utilisez le formulaire ci-dessous pour nous suggérer un prix !");
    }
}
</script>

</body>
</html>
